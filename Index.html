<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Glint — Neon Dodge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@600;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#050914;
    --bg2:#0B1230;
    --cyan:#3FE0D0;
    --magenta:#FF4FD8;
    --amber:#FFC24B;
    --violet:#8B5CF6;
    --cream:#EAF6FF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%;
    background:radial-gradient(ellipse at 50% -10%, #14204A 0%, var(--bg1) 60%);
    font-family:'Inter',sans-serif;
    color:var(--cream);
    overscroll-behavior:none;
    touch-action:none;
    display:flex; align-items:flex-start; justify-content:center;
    min-height:100vh;
  }
  .wrap{
    width:100%; max-width:420px; padding:18px 16px 30px;
    display:flex; flex-direction:column; align-items:center;
  }
  .hdr{
    width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
  }
  h1{
    font-family:'Baloo Thambi 2',sans-serif; font-weight:800; font-size:28px; margin:0;
    background:linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 22px rgba(63,224,208,0.25);
  }
  .stats{ display:flex; gap:8px; }
  .stat{
    background:rgba(255,255,255,0.05); border:1px solid rgba(63,224,208,0.3);
    border-radius:10px; padding:5px 10px; text-align:center; min-width:56px;
  }
  .stat .l{ font-size:8.5px; text-transform:uppercase; letter-spacing:1px; color:var(--cyan); font-weight:700; }
  .stat .v{ font-size:17px; font-weight:800; font-family:'Baloo Thambi 2',sans-serif; display:inline-block; }
  .stat .v.pulse{ animation:statPulse .3s ease; }
  @keyframes statPulse{
    0%{ transform:scale(1); color:var(--cream); }
    50%{ transform:scale(1.35); color:var(--amber); }
    100%{ transform:scale(1); color:var(--cream); }
  }

  .stage{
    position:relative; width:100%; width:max(280px, min(100%, calc((100vh - 150px) * 9 / 14))); width:max(280px, min(100%, calc((100dvh - 150px) * 9 / 14))); aspect-ratio:9/14;
    background:linear-gradient(180deg, #0A1130 0%, #062038 55%, #041428 100%);
    border-radius:16px; overflow:hidden;
    border:1px solid rgba(63,224,208,0.25);
    box-shadow:inset 0 0 60px rgba(139,92,246,0.12), 0 12px 30px rgba(0,0,0,0.5);
  }
  .lanes-fx{
    position:absolute; inset:0; opacity:0.06;
    background-image: linear-gradient(90deg, var(--cream) 1px, transparent 1px);
    background-size:20% 100%;
    z-index:1;
  }
  .corner-glow{
    position:absolute; width:200px; height:200px; z-index:2;
    border-radius:50%; filter:blur(24px); pointer-events:none;
    animation:cornerPulse 4s ease-in-out infinite;
  }
  .corner-glow.tl{ top:-70px; left:-70px; background:radial-gradient(circle, rgba(63,224,208,0.9), transparent 65%); animation-delay:0s; }
  .corner-glow.tr{ top:-70px; right:-70px; background:radial-gradient(circle, rgba(255,79,216,0.85), transparent 65%); animation-delay:1s; }
  .corner-glow.bl{ bottom:-70px; left:-70px; background:radial-gradient(circle, rgba(139,92,246,0.85), transparent 65%); animation-delay:2s; }
  .corner-glow.br{ bottom:-70px; right:-70px; background:radial-gradient(circle, rgba(255,194,75,0.85), transparent 65%); animation-delay:3s; }
  @keyframes cornerPulse{
    0%,100%{ opacity:0.7; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.35); }
  }
  .shimmer{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, rgba(63,224,208,0.05) 0%, transparent 30%, transparent 70%, rgba(63,224,208,0.08) 100%);
    animation:shimmerPulse 4s ease-in-out infinite;
  }
  @keyframes shimmerPulse{
    0%,100%{ opacity:0.6; }
    50%{ opacity:1; }
  }
  .star{
    position:absolute; border-radius:50%; z-index:1; pointer-events:none;
    background:#fff; animation-name:twinkle; animation-timing-function:ease-in-out; animation-iteration-count:infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(0.8); }
    50%{ opacity:0.9; transform:scale(1.2); }
  }
  .stage.shake{ animation:shakeStage .35s ease; }
  @keyframes shakeStage{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px) translateY(2px); }
    40%{ transform:translateX(6px) translateY(-2px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }
  .hit-flash{
    position:absolute; inset:0; z-index:19; pointer-events:none;
    background:rgba(255,79,216,0.35); opacity:0;
    animation:hitFlash .35s ease-out;
  }
  @keyframes hitFlash{
    0%{ opacity:0.9; }
    100%{ opacity:0; }
  }
  .particle{
    position:absolute; width:6px; height:6px; border-radius:50%; z-index:6; pointer-events:none;
    animation:particleBurst .55s ease-out forwards;
  }
  @keyframes particleBurst{
    0%{ transform:translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(var(--px), var(--py)) scale(0.2); opacity:0; }
  }
  #player{
    position:absolute; width:34px; height:34px;
    transition:left .02s linear, transform .12s ease-out;
    z-index:5;
  }
  #player .head{
    position:absolute; inset:0; border-radius:50% 50% 42% 42%;
    background:linear-gradient(160deg, #8CF29B, #1F9A52 65%, #0C5C30 100%);
    box-shadow:0 0 14px rgba(90,230,140,0.65), 0 0 26px rgba(31,154,82,0.35);
    animation:idleBob 1.6s ease-in-out infinite;
  }
  @keyframes idleBob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-3px); }
  }
  #player .eye{
    position:absolute; top:9px; width:6px; height:6px; background:#fff; border-radius:50%;
  }
  #player .eye.l{ left:5px; }
  #player .eye.r{ right:5px; }
  #player .eye::after{
    content:''; position:absolute; width:3px; height:3px; background:#04160f; border-radius:50%;
    top:1.5px; left:1.5px;
  }
  #player .mouth{
    position:absolute; top:-5px; left:50%; width:16px; height:14px;
    transform:translateX(-50%) scaleY(1);
    background:#4A0E0E;
    clip-path:polygon(50% 100%, 0 0, 100% 0);
    transform-origin:bottom center;
    transition:transform .1s ease;
  }
  #player .mouth.chomp{
    animation:chompAnim .15s ease;
  }
  @keyframes chompAnim{
    0%{ transform:translateX(-50%) scaleY(1); }
    50%{ transform:translateX(-50%) scaleY(0.35); }
    100%{ transform:translateX(-50%) scaleY(1); }
  }
  .obstacle{
    position:absolute; border-radius:6px; z-index:4;
    animation-name:spinObstacle; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes spinObstacle{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  .gem{
    position:absolute; border-radius:50%; z-index:4;
    animation:gemPulse 0.9s ease-in-out infinite;
  }
  @keyframes gemPulse{
    0%,100%{ transform:scale(1); filter:brightness(1); }
    50%{ transform:scale(1.18); filter:brightness(1.35); }
  }
  .startCard, .overCard{
    position:absolute; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(5,9,20,0.72); text-align:center; padding:24px;
    backdrop-filter:blur(2px);
  }
  .startCard h2, .overCard h2{
    font-family:'Baloo Thambi 2',sans-serif; font-size:24px; margin:0 0 8px;
    color:var(--cream);
  }
  .startCard p, .overCard p{ font-size:12.5px; color:#9FB4D8; margin:0 0 18px; line-height:1.6; }
  .bigbtn{
    background:linear-gradient(135deg, var(--cyan), var(--violet));
    border:none; border-radius:12px; padding:12px 28px;
    font-family:'Baloo Thambi 2',sans-serif; font-weight:700; font-size:15px;
    color:#04121A; cursor:pointer;
    box-shadow:0 4px 0 #1f6e64, 0 8px 18px rgba(0,0,0,0.4);
  }
  .bigbtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #1f6e64; }
  .overCard .score-line{ font-family:'Baloo Thambi 2',sans-serif; font-size:38px; color:var(--amber); margin:2px 0 4px; }
  .controls-hint{
    margin-top:14px; font-size:11.5px; color:#7A8FB8; text-align:center; line-height:1.5;
  }
  .controls-hint b{ color:var(--cyan); }
  .dev{display:flex;flex-direction:column;align-items:center;margin-bottom:10px}
  .dev img{width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:center;border:2px solid var(--cyan);box-shadow:0 0 18px rgba(63,224,208,0.55),0 0 34px rgba(255,79,216,0.25)}
  .dev span{margin-top:8px;font-size:12px;letter-spacing:.5px;color:var(--cyan);font-weight:600}
  .dev img{cursor:zoom-in}
  .dev .tap{font-size:10px;color:#7A8FB8;margin-top:2px}
  #lightbox{position:fixed;inset:0;z-index:100;background:rgba(3,6,16,0.94);display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;cursor:zoom-out}
  #lightbox img{max-width:100%;max-height:calc(100% - 40px);object-fit:contain;border-radius:10px;box-shadow:0 0 30px rgba(63,224,208,0.5)}
  #lightbox span{margin-top:10px;color:var(--cyan);font-weight:600;font-size:13px}
</style>
</head>
